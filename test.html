<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cron Expression Validator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md mx-auto p-6 bg-white rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4 text-center">Cron Expression Validator</h1>
        <div class="relative">
            <p id="errorMessage" class="text-red-500 text-sm mb-1 absolute -top-6 left-0 hidden">
                Invalid cron expression
            </p>
            <input
                type="text"
                id="cronExpression"
                name="cronExpression"
                class="block w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                placeholder="Enter cron expression"
            />
        </div>
    </div>

    <script>
        // Function to validate cron expression
        function isValidCronExpression(cronExpression) {
            const cronRegex = /^(\*|([0-9]|1[0-9]|2[0-9]|3[0-9]|4[0-9]|5[0-9])|\*\/([0-9]|1[0-9]|2[0-9]|3[0-9]|4[0-9]|5[0-9])) (\*|([0-9]|1[0-9]|2[0-3])|\*\/([0-9]|1[0-9]|2[0-3])) (\*|([1-9]|1[0-9]|2[0-9]|3[0-1])|\*\/([1-9]|1[0-9]|2[0-9]|3[0-1])) (\*|([1-9]|1[0-2])|\*\/([1-9]|1[0-2])) (\*|([0-6])|\*\/([0-6]))$/;
            return cronRegex.test(cronExpression);
        }

        // Function to handle input validation
        function validateCronExpression() {
            const cronInput = document.getElementById('cronExpression');
            const errorMessage = document.getElementById('errorMessage');
            const cronExpression = cronInput.value.trim();

            if (isValidCronExpression(cronExpression)) {
                errorMessage.classList.add('hidden');
            } else {
                errorMessage.classList.remove('hidden');
            }
        }

        // Add event listener to the input
        document.addEventListener('DOMContentLoaded', () => {
            const cronInput = document.getElementById('cronExpression');
            cronInput.addEventListener('input', validateCronExpression);
        });
    </script>
</body>
</html>
